services:
  - type: web
    name: nevo-backend
    runtime: python
    plan: starter
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_PASSWORD_PEPPER
        generateValue: true
      - key: AUTH_PIN_PEPPER
        generateValue: true
      - key: AUTH_SESSION_PEPPER
        generateValue: true
      - key: CONSENT_PUBLIC_BASE_URL
        value: https://rubbish-frontend.example.com
      - key: AI_PROVIDER
        value: claude
      - key: AI_ANTHROPIC_API_KEY
        sync: false
      - key: AI_ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: AI_PROMPT_CACHING_ENABLED
        value: "true"
      - key: AI_REQUESTS_PER_MINUTE
        value: "60"
      - key: AI_MAX_CONCURRENCY
        value: "4"
      - key: AI_INPUT_COST_USD_PER_MILLION
        value: "1"
      - key: AI_OUTPUT_COST_USD_PER_MILLION
        value: "5"
      - key: SSO_PUBLIC_BASE_URL
        sync: false
      - key: SSO_SCHOOL_BASE_URL
        sync: false
      - key: SSO_MICROSOFT_CLIENT_SECRET
        sync: false
      - key: SSO_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SSO_GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SSO_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        value: Nevo <noreply@nevolearning.com>
      - key: EMAIL_FRONTEND_BASE_URL
        sync: false
      - key: YARNGPT_API_KEY
        sync: false
      - key: YARNGPT_API_URL
        value: https://yarngpt.ai/api/v1/tts
      - key: YARNGPT_VOICE
        value: Idera
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lesson-media
      - key: SUPABASE_STORAGE_PUBLIC
        value: "true"
